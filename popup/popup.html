<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisk 자동화</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- License Lock Screen -->
  <div id="licenseScreen" class="license-screen" hidden>
    <div class="license-box">
      <h2>Whisk 자동화</h2>
      <p class="license-desc">라이센스 키를 입력해주세요</p>
      <div class="license-input-group">
        <input type="text" id="licenseKeyInput" placeholder="WHISK-XXXX-XXXX" maxlength="15" spellcheck="false" autocomplete="off">
        <button id="licenseSubmitBtn" class="btn btn-primary">확인</button>
      </div>
      <p class="license-error" id="licenseError" hidden></p>
      <p class="license-hint">유튜브 커뮤니티에서 키를 확인하세요</p>
    </div>
  </div>

  <div class="container" id="mainContainer" hidden>
    <header>
      <h1>Whisk 자동화</h1>
      <span class="status" id="connectionStatus">연결 확인 중...</span>
    </header>

    <!-- License Status Bar -->
    <div class="license-bar" id="licenseBar">
      <span id="licenseStatus"></span>
      <button id="licenseChangeBtn" class="btn btn-small btn-secondary">키 변경</button>
    </div>

    <section class="input-section">
      <div class="input-header">
        <h2>프롬프트 입력</h2>
        <label class="file-input-label">
          <input type="file" id="fileInput" accept=".txt" hidden>
          📁 파일 불러오기
        </label>
      </div>
      <textarea
        id="promptInput"
        placeholder="프롬프트를 입력하세요. 줄바꿈으로 구분됩니다.&#10;&#10;예시:&#10;a cute cat wearing a hat&#10;a dog playing in the park&#10;a bird flying in the sky"
        rows="6"
      ></textarea>
      <div class="input-actions">
        <button id="addPromptsBtn" class="btn btn-secondary">프롬프트 추가</button>
      </div>
    </section>

    <section class="queue-section">
      <div class="queue-header">
        <h2>대기열 <span id="queueCount">(0개)</span></h2>
        <button id="clearQueueBtn" class="btn btn-small btn-danger">전체 삭제</button>
      </div>
      <ul id="promptQueue" class="prompt-list">
        <li class="empty-message">프롬프트를 추가해주세요</li>
      </ul>
    </section>

    <section class="project-section">
      <div class="project-tabs" id="projectTabs">
        <!-- 동적으로 렌더링됨 -->
      </div>
      <div class="character-list" id="characterList">
        <!-- 동적으로 렌더링됨 -->
      </div>
      <div class="project-actions">
        <button id="loadCharFolderBtn" class="btn btn-small btn-primary">📁 폴더에서 불러오기</button>
        <button id="refreshCharFolderBtn" class="btn btn-small btn-secondary">🔄 새로고침</button>
      </div>
      <p class="hint" id="charFolderHint">피사체/장면/스타일 폴더가 있는 상위 폴더를 선택하세요<br>예: outputs/whisk/ 폴더</p>
    </section>

    <section class="style-section">
      <div class="style-header">
        <h2>프로젝트 스타일 설정</h2>
        <button id="captureStyleBtn" class="btn btn-small btn-capture">📷 캡처</button>
      </div>
      <div class="style-inputs">
        <div class="style-input-group">
          <label for="styleUrl">스타일 이미지:</label>
          <input type="text" id="styleUrl" placeholder="URL 또는 캡처로 설정">
        </div>
        <div class="style-input-group">
          <label for="stylePrefix">스타일 접두어:</label>
          <input type="text" id="stylePrefix" placeholder="예: Korean Wuxia Manhwa style, ">
        </div>
        <div class="style-input-group">
          <label for="styleSuffix">스타일 접미어:</label>
          <input type="text" id="styleSuffix" placeholder="예: , high quality, detailed">
        </div>
      </div>
      <p class="hint">프로젝트별로 저장됨. 모든 프롬프트에 자동 적용</p>
      <div class="style-presets" id="stylePresetList" hidden>
        <label class="style-presets-label">스타일 프리셋:</label>
        <div class="style-presets-tags" id="stylePresetTags">
          <!-- 동적으로 렌더링됨 -->
        </div>
      </div>
    </section>

    <!-- 미등록 캐릭터 경고 -->
    <div id="characterWarning" class="warning-box" hidden>
      <span class="warning-icon">⚠️</span>
      <span id="warningText">미등록 캐릭터: </span>
    </div>

    <section class="settings-section">
      <label class="toggle-label">
        <input type="checkbox" id="autoDownload" checked>
        <span class="toggle-text">자동 다운로드</span>
      </label>
      <div class="delay-setting">
        <label for="delayInput">생성 간격 (초):</label>
        <input type="number" id="delayInput" value="3" min="1" max="30">
      </div>
    </section>

    <section class="save-location-section">
      <div class="save-location-header">
        <label for="saveLocation">저장 위치:</label>
        <button id="resetLocationBtn" class="btn btn-small btn-secondary">위치 변경</button>
        <button id="resetToDefaultBtn" class="btn btn-small btn-danger" hidden>초기화</button>
        <button id="openFolderBtn" class="btn btn-small btn-secondary">📂 열기</button>
      </div>
      <input type="text" id="saveLocation" placeholder="whisk-images" value="whisk-images">
      <p class="hint" id="saveLocationHint">다운로드 폴더 기준 하위 경로 (예: whisk-images)</p>
    </section>

    <section class="progress-section" id="progressSection" hidden>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text">
        <span id="currentIndex">0</span> / <span id="totalCount">0</span> 완료
      </p>
      <p class="current-prompt" id="currentPrompt"></p>
    </section>

    <section class="control-section">
      <button id="startBtn" class="btn btn-primary" disabled>▶ 시작</button>
      <button id="stopBtn" class="btn btn-danger" hidden>⏹ 중지</button>
    </section>

    <footer>
      <p class="hint">💡 Whisk 페이지에서 사용하세요</p>
    </footer>
  </div>

  <!-- 캐릭터 저장 모달 -->
  <div id="captureModal" class="modal" hidden>
    <div class="modal-content">
      <h3>캐릭터로 저장</h3>
      <div class="modal-preview">
        <img id="capturedImage" src="" alt="캡처된 이미지">
      </div>
      <div class="modal-form">
        <div class="form-group">
          <label for="charNameInput">캐릭터 이름:</label>
          <input type="text" id="charNameInput" placeholder="예: 철무영">
        </div>
        <div class="form-group">
          <label for="charAliasInput">별명 (쉼표로 구분):</label>
          <input type="text" id="charAliasInput" placeholder="예: 무영, 철검객">
        </div>
      </div>
      <div class="modal-actions">
        <button id="cancelCaptureBtn" class="btn btn-small btn-secondary">취소</button>
        <button id="saveCaptureBtn" class="btn btn-small btn-primary">저장</button>
      </div>
    </div>
  </div>

  <script src="characters_base64.js"></script>
  <script src="prompt_safety.js"></script>
  <script src="license.js"></script>
  <script src="popup.js"></script>
</body>
</html>
