<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구독 완료 - Whisk Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      padding: 40px 24px;
      text-align: center;
    }
    .check-icon {
      width: 80px;
      height: 80px;
      background: #1e4620;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #4ade80;
    }
    .desc {
      color: #999;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .info-box {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 32px;
      text-align: left;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
    }
    .info-row .label { color: #999; }
    .info-row .value { color: #e0e0e0; font-weight: 500; }
    .close-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .close-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="check-icon">&#10003;</div>
    <h1>구독이 시작되었습니다!</h1>
    <p class="desc">
      Whisk Pro의 모든 기능을 이용할 수 있습니다.<br>
      확장 프로그램을 열면 자동으로 Pro로 전환됩니다.
    </p>

    <div class="info-box">
      <div class="info-row">
        <span class="label">플랜</span>
        <span class="value" id="planName">-</span>
      </div>
      <div class="info-row">
        <span class="label">다음 결제일</span>
        <span class="value" id="expiresAt">-</span>
      </div>
      <div class="info-row">
        <span class="label">취소 정책</span>
        <span class="value">언제든 취소 가능, 기간 만료까지 이용</span>
      </div>
    </div>

    <button class="close-btn" onclick="window.close()">확인</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan');
    const expires = params.get('expires');

    const planNames = { monthly: '월간 구독 (₩9,900/월)', yearly: '연간 구독 (₩100,000/년)' };
    document.getElementById('planName').textContent = planNames[plan] || '-';

    if (expires) {
      try {
        const d = new Date(expires);
        document.getElementById('expiresAt').textContent =
          `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
      } catch {
        document.getElementById('expiresAt').textContent = expires;
      }
    }
  </script>
</body>
</html>
